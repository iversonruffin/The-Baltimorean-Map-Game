<ng-container *ngIf="location">
  <div id="zoom-wrap" #zoomWrapEl>
    <div id="scene" #sceneEl>
      <div class="layer sky" data-depth="0.00"></div>

      <div class="layer" data-depth="0.08">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
      </div>

      <div class="layer skyline" data-depth="0.20"></div>
      <div class="layer water" data-depth="0.35"></div>
      <div class="layer pier" data-depth="0.55"></div>

      <div class="layer interactive" data-depth="0.55">
        <div
          *ngFor="let hotspot of hotspots"
          [id]="'beacon-' + hotspot.id"
          class="beacon"
          [class.locked]="!isUnlocked(hotspot)"
          [class.completed]="isCompleted(hotspot)"
          [style.left.%]="hotspot.position.xPct"
          [style.bottom.%]="100 - hotspot.position.yPct"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Open ' + hotspot.name"
          (click)="openHotspot(hotspot)"
          (keydown.enter)="openHotspot(hotspot)"
        >
          <div class="beacon-label">
            {{ hotspot.name }}
            <span *ngIf="!isUnlocked(hotspot)" title="Locked">🔒</span>
            <span *ngIf="isCompleted(hotspot)" title="Completed">✓</span>
          </div>
          <div class="beacon-ping" *ngIf="isUnlocked(hotspot) && !isCompleted(hotspot)"></div>
          <svg class="beacon-house" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
            <polygon points="32,6 58,28 6,28" fill="#c0392b" stroke="#7a231b" stroke-width="2" />
            <rect x="14" y="28" width="36" height="26" fill="#f4ede0" stroke="#7a231b" stroke-width="2" />
            <rect x="27" y="36" width="10" height="18" fill="#7a5a34" />
            <rect x="18" y="34" width="8" height="8" fill="#a9d8ef" stroke="#7a231b" stroke-width="1.5" />
            <rect x="38" y="34" width="8" height="8" fill="#a9d8ef" stroke="#7a231b" stroke-width="1.5" />
          </svg>
        </div>
      </div>

      <div class="layer" data-depth="0.85">
        <div class="fg-cloud fg-cloud1"></div>
        <div class="fg-cloud fg-cloud2"></div>
      </div>
    </div>
  </div>

  <div id="top-bar">
    <a routerLink="/" id="back-link">‹ City Map</a>
    <div id="location-heading">
      <h1>{{ location.name }}</h1>
      <app-progress-bar [pct]="progress.getLocationProgressPct(location.id)"></app-progress-bar>
    </div>
    <button id="leaderboard-toggle" (click)="toggleLeaderboard()">🏅 Leaderboard</button>
  </div>

  <div id="leaderboard-panel" *ngIf="leaderboardVisible">
    <app-leaderboard [locationId]="location.id"></app-leaderboard>
  </div>

  <h2 id="hint" [style.opacity]="hintVisible ? 1 : 0">Hover a beacon, then click it to explore</h2>

  <div id="player">
    <img src="images/bird.png" alt="" />
  </div>

  <app-hotspot-modal *ngIf="activeHotspot" [hotspot]="activeHotspot" [active]="modalActive" (closed)="closeModal()"></app-hotspot-modal>
</ng-container>
